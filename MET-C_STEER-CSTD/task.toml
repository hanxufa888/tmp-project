schema_version = "1.4"

artifacts = [
  { source = "/app/specification_check/output", destination = "workflow" },
  { source = "/app/specification_check/check_spec", destination = "check_spec" },
]

[metadata]
difficulty = "hard"
category = "file-operations"
tags = ["skill", "speccheck-workflow", "xlsm", "text-only", "mcp", "functional-test"]

[agent]
timeout_sec = 7200.0

[verifier]
timeout_sec = 180.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240

[[environment.mcp_servers]]
name = "KGA-local"
transport = "streamable-http"
url = "http://172.30.251.179:8002/mcp"
headers = { Authorization = "${KGA_MCP_AUTHORIZATION}" }
